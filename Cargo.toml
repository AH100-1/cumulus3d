[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/features",
    "crates/matching",
    "crates/ba",
    "crates/sfm",
    "crates/align",
    "crates/dense",
    "crates/cli",
    "crates/cuda",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AH100-1/skyrecon"
rust-version = "1.87"

[workspace.dependencies]
skyrecon-core = { path = "crates/core", version = "0.1.0" }
skyrecon-features = { path = "crates/features", version = "0.1.0" }
skyrecon-matching = { path = "crates/matching", version = "0.1.0" }
skyrecon-ba = { path = "crates/ba", version = "0.1.0" }
skyrecon-sfm = { path = "crates/sfm", version = "0.1.0" }
skyrecon-align = { path = "crates/align", version = "0.1.0" }
skyrecon-dense = { path = "crates/dense", version = "0.1.0" }
skyrecon-cuda = { path = "crates/cuda", version = "0.1.0" }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12040"] }
nalgebra = "0.35"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
faer = "0.24"
rand = "0.10"
rand_pcg = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
