[package]
name = "skyrecon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "skyrecon command-line tool: progressive drone-image 3D reconstruction in one process"
repository.workspace = true
keywords = ["sfm","photogrammetry","drone","point-cloud","cli"]
categories = ["computer-vision","command-line-utilities"]
readme = "README.md"

[[bin]]
name = "skyrecon"
path = "src/main.rs"

[dependencies]
skyrecon-core.workspace = true
skyrecon-features.workspace = true
skyrecon-matching.workspace = true
skyrecon-ba.workspace = true
skyrecon-sfm.workspace = true
skyrecon-align.workspace = true
skyrecon-dense.workspace = true
skyrecon-cuda.workspace = true
clap.workspace = true
rayon.workspace = true
nalgebra.workspace = true
image.workspace = true

[lib]
name = "skyrecon_cli"
path = "src/lib.rs"
